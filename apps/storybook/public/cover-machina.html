<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DaVinci.AI Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09070d;--text:#F5F5F6;--text2:#B4B0BE;--text3:#8E8A99;--cyan:#3CCBF4;--violet:#A78BFA;--amber:#FFA24C;--pink:#FF5A8A;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;padding:0!important}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 900px at 68% 50%,#1d1226 0%,#120b18 45%,#09070d 100%)}
.l{position:absolute;will-change:transform}
canvas{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.vit{position:absolute;left:1040px;top:90px;width:900px;height:900px;opacity:.12}
#robot{position:absolute;left:1120px;top:40px;height:1080px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
.copy{position:absolute;left:150px;top:300px;width:900px}
.eyebrow{font-size:20px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text3)}
.eyebrow b{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:176px;font-weight:800;letter-spacing:-.045em;line-height:.95;color:rgba(255,255,255,.92);margin-top:26px}
h1 span{background:linear-gradient(95deg,#A78BFA 0%,#FF5A8A 45%,#FFA24C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:32px;line-height:1.4;color:var(--text2);margin-top:34px;max-width:760px}
.pills{display:flex;gap:12px;margin-top:44px;flex-wrap:wrap}
.pill{height:46px;padding:0 20px;border-radius:999px;display:inline-flex;align-items:center;font-size:18px;font-weight:500;color:var(--text2);background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);backdrop-filter:blur(10px)}
.foot{position:absolute;left:150px;bottom:80px;font-size:18px;letter-spacing:.08em;color:var(--text3)}
.fade{animation:up 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

const robot=document.getElementById('robot'),copy=document.getElementById('copy'),vit=document.getElementById('vit'),glows=document.getElementById('glows');
function frame(t){
  sx+=(tx-sx)*.05;sy+=(ty-sy)*.05;
  robot.style.transform=`translate(${-sx*30}px,${-sy*16}px)`;copy.style.transform=`translate(${sx*12}px,${sy*8}px)`;
  vit.style.transform=`translate(${-sx*14}px,${-sy*10}px) rotate(${t/1000*1.2+sx*6}deg)`;glows.style.transform=`translate(${-sx*50}px,${-sy*30}px)`;
  nx.clearRect(0,0,1920,1080);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>1920)p.vx*=-1;if(p.y<0||p.y>1080)p.vy*=-1;
    if(on){const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<170&&d>1){p.x+=dx/d*.6;p.y+=dy/d*.6}}}
  nx.lineWidth=.6;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){nx.strokeStyle=`rgba(${a.c},${(1-d/120)*.18})`;nx.beginPath();nx.moveTo(a.x,a.y);nx.lineTo(b.x,b.y);nx.stroke()}}
  if(on){for(const p of P){const d=Math.hypot(p.x-mx,p.y-my);if(d<220){nx.strokeStyle=`rgba(${p.c},${(1-d/220)*.42})`;nx.beginPath();nx.moveTo(mx,my);nx.lineTo(p.x,p.y);nx.stroke()}}
    const g=nx.createRadialGradient(mx,my,0,mx,my,160);g.addColorStop(0,'rgba(167,139,250,.10)');g.addColorStop(1,'rgba(167,139,250,0)');nx.fillStyle=g;nx.beginPath();nx.arc(mx,my,160,0,6.283);nx.fill()}

    ex.fillStyle=`rgba(${e.c},${e.life*.8})`;ex.beginPath();ex.arc(e.x-sx*30,e.y-sy*16,e.r,0,6.283);ex.fill()}
  if(!RM)requestAnimationFrame(frame)}

</script>
